services:
  postgres:
    image: postgres:16-alpine
    container_name: pokyplane-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokyplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokyplane_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pokyplane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pokyplane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokyplane} -d ${POSTGRES_DB:-pokyplane}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pokyplane_pgdata:
